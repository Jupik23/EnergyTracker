name: Update data

# Fetches the latest generation mix and prices and publishes static JSON to the
# `data` branch. The app reads it from raw.githubusercontent.com.
# GitHub may delay scheduled runs by a few minutes under load; that is fine
# because upstream data itself is published with a delay.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      zones:
        description: Comma-separated zone ids or country codes, e.g. "pl,se3,it" (empty = all)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A cold run (empty cache) makes ~95 rate-limited requests; normal runs ~35.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore previous data
        run: |
          git clone --quiet --depth 1 --branch data --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" data-out || mkdir -p data-out
          rm -rf data-out/.git

      # The pipeline has no runtime dependencies, so skip `npm ci` and run it
      # straight through tsx (path alias for @energy/core lives in tsconfig.base.json).
      - name: Run pipeline
        env:
          ZONES: ${{ inputs.zones }}
        run: |
          args=(--out data-out)
          if [ -n "$ZONES" ]; then args+=(--zones "$ZONES"); fi
          npx --yes tsx@4.23.15 --tsconfig packages/pipeline/tsconfig.json \
            packages/pipeline/src/run.ts "${args[@]}"

      # Extras built on top of the fresh snapshots. Failures here must never
      # block publishing the data itself, hence continue-on-error.
      #
      # The weekly "Train forecast" workflow publishes models and the one-year
      # price history to the separate `models` branch (so it never races this
      # job's force-push); copy them in so they are served from `data` too.
      - name: Copy forecast models
        continue-on-error: true
        run: |
          if git clone --quiet --depth 1 --branch models --single-branch \
               "https://github.com/${GITHUB_REPOSITORY}.git" models-in; then
            cp -r models-in/v1/. data-out/v1/
          else
            echo "No models branch yet — run the Train forecast workflow."
          fi

      - name: 7-day forecast (refreshes every 3 h)
        continue-on-error: true
        run: |
          npx --yes tsx@4.23.15 --tsconfig packages/pipeline/tsconfig.json \
            packages/pipeline/src/forecast/run.ts --out data-out

      - name: Smart-home feed
        continue-on-error: true
        run: |
          npx --yes tsx@4.23.15 --tsconfig packages/pipeline/tsconfig.json \
            packages/pipeline/src/feed/run.ts --out data-out

      # The data branch is a single orphan commit, force-pushed each run, so
      # 96 updates a day never bloat the repository history.
      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp docs/data-branch-README.md data-out/README.md
          cd data-out
          git init --quiet --initial-branch data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
